name: Build WorkNote iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build WorkNote IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          xcodebuild -version
          swift --version
          echo "SDK path: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Compile WorkNote ARM64 for iOS
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swift build -c release \
            --triple arm64-apple-ios17.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH"

      - name: Assemble and Package IPA
        run: |
          mkdir -p Payload/WorkNote.app
          
          # Find the compiled binary
          BIN_PATH=$(find .build -name "WorkNote" -type f -perm +111 | grep -v "macosx" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find .build -name "VoiceTodo" -type f -perm +111 | grep -v "macosx" | head -n 1)
          fi
          echo "Found binary at: $BIN_PATH"
          
          cp "$BIN_PATH" Payload/WorkNote.app/WorkNote
          cp Support/Info.plist Payload/WorkNote.app/Info.plist
          cp Support/AppIcon.png Payload/WorkNote.app/AppIcon.png 2>/dev/null || true
          cp Support/worknote_logo.png Payload/WorkNote.app/worknote_logo.png 2>/dev/null || true
          
          # Ad-hoc sign for Sideloadly / AltStore
          codesign --force --deep --sign - Payload/WorkNote.app
          
          mkdir -p dist
          zip -r -y dist/WorkNote.ipa Payload
          echo "Successfully created dist/WorkNote.ipa!"
          ls -la dist/WorkNote.ipa

      - name: Upload WorkNote IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkNote-IPA
          path: dist/WorkNote.ipa
          if-no-files-found: error
