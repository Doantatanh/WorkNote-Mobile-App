name: Build WorkNote iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build WorkNote IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build WorkNote iOS App with Xcode
        run: |
          mkdir -p dist/Payload
          
          # Compile via xcodebuild for generic iOS device (Release)
          set -o pipefail
          xcodebuild build \
            -scheme WorkNote \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcode_build.log || {
              echo "=== BUILD FAILED: PRINTING ERROR LOGS ==="
              grep -E -C 3 -i "error:|fatal error:" xcode_build.log | tail -n 60
              exit 1
            }
          
          # Locate built app bundle or compiled binary
          mkdir -p dist/Payload/WorkNote.app
          
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found .app bundle at: $APP_PATH"
            cp -R "$APP_PATH/"* dist/Payload/WorkNote.app/
          else
            echo "No .app wrapper created by SwiftPM; locating compiled WorkNote binary..."
            BIN_PATH=$(find build/DerivedData/Build/Products -name "WorkNote" -type f ! -name "*.d" ! -name "*.dia" ! -name "*.o" | head -n 1)
            
            if [ -z "$BIN_PATH" ]; then
              echo "Binary not found. Listing all files in DerivedData:"
              find build/DerivedData -type f
              exit 1
            fi
            
            echo "Found compiled binary at: $BIN_PATH"
            cp "$BIN_PATH" dist/Payload/WorkNote.app/WorkNote
            chmod +x dist/Payload/WorkNote.app/WorkNote
          fi
          
          # Inject App Info & Icons
          cp Support/Info.plist dist/Payload/WorkNote.app/Info.plist
          echo -n "APPL????" > dist/Payload/WorkNote.app/PkgInfo
          cp Support/AppIcon.png dist/Payload/WorkNote.app/AppIcon.png 2>/dev/null || true
          cp Support/AppIcon.png dist/Payload/WorkNote.app/AppIcon60x60@2x.png 2>/dev/null || true
          cp Support/worknote_logo.png dist/Payload/WorkNote.app/worknote_logo.png 2>/dev/null || true

          # Ad-hoc sign for Sideloadly / AltStore / iOS
          echo "Signing WorkNote.app..."
          codesign --force --deep --sign - dist/Payload/WorkNote.app

          # Package into IPA
          echo "Packaging WorkNote.ipa..."
          (cd dist && zip -r -y WorkNote.ipa Payload)
          echo "=== Successfully created WorkNote.ipa! ==="
          ls -lh dist/WorkNote.ipa

      - name: Upload WorkNote IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkNote-IPA
          path: dist/WorkNote.ipa
          if-no-files-found: error
