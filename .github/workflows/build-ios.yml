name: Build WorkNote iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build WorkNote IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build WorkNote iOS App with Xcode
        run: |
          mkdir -p dist/Payload
          
          # Compile via xcodebuild for generic iOS device (Release)
          xcodebuild build \
            -scheme WorkNote \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          
          # Locate built app bundle
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          echo "Found built app bundle at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Failed to locate .app bundle. Output directory structure:"
            find build -maxdepth 4
            exit 1
          fi
          
          cp -R "$APP_PATH" dist/Payload/WorkNote.app
          
          # Inject App Icon & Assets if needed
          cp Support/Info.plist dist/Payload/WorkNote.app/Info.plist
          cp Support/AppIcon.png dist/Payload/WorkNote.app/AppIcon.png 2>/dev/null || true
          cp Support/worknote_logo.png dist/Payload/WorkNote.app/worknote_logo.png 2>/dev/null || true

          # Ad-hoc sign for Sideloadly / AltStore
          codesign --force --deep --sign - dist/Payload/WorkNote.app

          # Package into IPA
          cd dist
          zip -r -y WorkNote.ipa Payload
          echo "Successfully created WorkNote.ipa!"
          ls -lh WorkNote.ipa

      - name: Upload WorkNote IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkNote-IPA
          path: dist/WorkNote.ipa
          if-no-files-found: error
